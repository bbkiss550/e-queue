<!DOCTYPE html><html lang="th" class="light-style" data-assets-path="/assets/" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('จองคิว')}"></head>
<body data-page="booking"><header th:replace="~{fragments/common :: customerHeader}"></header><main class="container customer-main">
  <div id="bookingStepper" class="booking-stepper" aria-label="ขั้นตอนการจอง"><div class="step active" data-step="1"><span>1</span><strong>เลือกวันและเวลา</strong></div><div class="step" data-step="2"><span>2</span><strong>กรอกข้อมูล</strong></div><div class="step" data-step="3"><span>3</span><strong>ยืนยันการจอง</strong></div></div>
  <section id="chooseStep"><h4 class="section-title">1. เลือกวันที่</h4><div class="date-selection"><div id="dateChoices" class="date-choices"></div><label class="date-picker-tile" title="เลือกวันที่"><i class="bx bx-calendar"></i><input type="date" id="bookingDate" aria-label="เลือกวันที่จอง"></label></div>
    <div class="slot-heading"><h4 class="section-title">2. เลือกเวลา</h4><small id="leadHint"></small></div><div id="bookingSlots" class="slot-grid" aria-live="polite"></div>
    <div class="slot-legend"><span><i class="legend-dot"></i>ว่าง</span><span><i class="legend-dot selected"></i>เลือกแล้ว</span><span><i class="legend-dot full"></i>เต็ม / ปิดรับจอง</span><span><i class="legend-dot last"></i>เหลือ 1 ที่</span></div>
    <div class="step-actions"><a href="/" class="btn btn-outline-secondary">กลับหน้าหลัก</a><button id="nextStep" class="btn btn-primary btn-lg" disabled>ถัดไป <i class="bx bx-right-arrow-alt"></i></button></div>
  </section>
  <section id="formStep" hidden><form id="customerBookingForm"><div class="row g-4"><div class="col-lg-4"><div class="card selected-summary"><div class="card-body"><h4>วันที่และเวลาที่เลือก</h4><div class="summary-line"><i class="bx bx-calendar"></i><div><span>วันที่</span><strong id="selectedDate"></strong></div></div><div class="summary-line"><i class="bx bx-time-five"></i><div><span>เวลา</span><strong id="selectedTime"></strong></div></div></div></div></div><div class="col-lg-8"><div class="card"><div class="card-body booking-form-body"><div class="d-flex align-items-center justify-content-between mb-4"><h4 class="mb-0">ข้อมูลผู้จอง</h4><button type="button" class="btn btn-label-primary" id="changeSelection">เปลี่ยน</button></div><div class="mb-4"><label class="form-label" for="customerName">ชื่อผู้จอง <span class="text-danger">*</span></label><input class="form-control form-control-lg" id="customerName" name="name" autocomplete="name" required maxlength="100" placeholder="ชื่อและนามสกุล"></div><div class="mb-4"><label class="form-label" for="customerPhone">เบอร์โทรศัพท์ <span class="text-danger">*</span></label><div class="input-group input-group-merge input-group-lg"><span class="input-group-text"><i class="bx bx-phone"></i></span><input class="form-control" id="customerPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="0812345678"></div></div><div class="form-check"><input class="form-check-input" id="confirmInfo" type="checkbox" required><label for="confirmInfo" class="form-check-label">ยืนยันว่าข้อมูลถูกต้อง</label></div><div id="bookingError" class="inline-error" role="alert" hidden></div></div></div></div></div><div class="step-actions"><button type="button" id="backStep" class="btn btn-outline-secondary btn-lg">ย้อนกลับ</button><button type="submit" class="btn btn-primary btn-lg">ยืนยันการจอง <i class="bx bx-right-arrow-alt"></i></button></div></form></section>
  <section id="successStep" class="success-page" hidden><div class="success-mark"><i class="bx bx-check"></i></div><h1>จองคิวสำเร็จ</h1><p>ระบบได้บันทึกการจองของคุณเรียบร้อยแล้ว</p><div class="card success-card"><div class="card-body" id="successDetails"></div></div><a class="btn btn-primary btn-lg" href="/"><i class="bx bx-home-alt me-2"></i>กลับหน้าหลัก</a><a class="btn btn-outline-secondary btn-lg" href="/check">ตรวจสอบการจอง</a></section>
</main><th:block th:replace="~{fragments/common :: overlays}"></th:block><th:block th:replace="~{fragments/common :: scripts}"></th:block><script src="/js/customer.js"></script></body></html>

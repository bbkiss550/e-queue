<!DOCTYPE html><html lang="th" class="light-style layout-menu-fixed" data-assets-path="/assets/" data-template="vertical-menu-template-free" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('รายการจอง')}"></head>
<body data-page="admin-bookings"><div class="layout-wrapper layout-content-navbar"><div class="layout-container"><th:block th:replace="~{fragments/common :: adminSidebar}"></th:block><div class="layout-page"><nav th:replace="~{fragments/common :: adminNavbar}"></nav><div class="content-wrapper"><main class="container-xxl flex-grow-1 container-p-y admin-main"><div class="admin-title-row"><div><h3>รายการจอง</h3><p class="text-muted mb-0">จัดการคิวและเวลานัดของลูกค้า</p></div><button class="btn btn-primary" id="addBooking"><i class="bx bx-plus me-1"></i>เพิ่มรายการจอง</button></div><div class="card booking-list-card"><div class="card-body"><div class="booking-toolbar"><div class="view-switch" role="group" aria-label="มุมมองรายการ"><button id="listView" class="btn btn-label-primary"><i class="bx bx-list-ul"></i> รายการ</button><button id="calendarView" class="btn btn-primary"><i class="bx bx-calendar"></i> ปฏิทิน</button></div><div class="date-navigation"><button id="previousDate" class="btn btn-outline-secondary btn-icon" aria-label="ก่อนหน้า"><i class="bx bx-chevron-left"></i></button><button id="dateLabel" class="btn btn-outline-secondary date-label"></button><button id="nextDate" class="btn btn-outline-secondary btn-icon" aria-label="ถัดไป"><i class="bx bx-chevron-right"></i></button><button id="todayDate" class="btn btn-outline-secondary">วันนี้</button><input type="date" id="adminDatePicker" aria-label="เลือกวันที่" class="form-control admin-date-picker"></div><select id="calendarMode" class="form-select calendar-mode" aria-label="มุมมองปฏิทิน"><option value="month">รายเดือน</option><option value="day">รายวัน</option></select></div><div class="search-box input-group input-group-merge mt-4"><span class="input-group-text"><i class="bx bx-search"></i></span><input class="form-control" id="adminSearch" maxlength="100" placeholder="ค้นหาจากชื่อหรือเบอร์โทรศัพท์..." aria-label="ค้นหาชื่อหรือเบอร์โทรศัพท์"><button id="clearSearch" class="input-group-text" aria-label="ล้างการค้นหา"><i class="bx bx-x"></i></button></div><div id="adminError" class="inline-error" role="alert" hidden></div><div class="list-meta"><span id="listCount"></span><span class="text-muted">เรียงตามเวลานัด</span></div><div id="calendarContent" aria-live="polite"></div><div id="listContent" hidden aria-live="polite"></div></div></div></main><footer class="content-footer footer bg-footer-theme"><div class="container-xxl py-3"><small>E-Queue · ระบบจองคิวออนไลน์</small></div></footer></div></div></div><div class="layout-overlay layout-menu-toggle"></div></div><th:block th:replace="~{fragments/common :: overlays}"></th:block><th:block th:replace="~{fragments/common :: scripts}"></th:block><script src="/js/admin.js"></script></body></html>

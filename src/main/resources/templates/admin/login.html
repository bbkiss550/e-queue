<!DOCTYPE html><html lang="th" class="light-style" data-assets-path="/assets/" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('เข้าสู่ระบบผู้ดูแล')}"></head>
<body data-page="login"><main class="login-shell"><section class="login-about"><a class="brand" href="/"><span th:text="${settings.shopName}">ABC Car Care</span></a><h2>ระบบจัดการการจอง</h2><div class="login-symbol"><i class="bx bx-calendar-check"></i></div><ul><li><i class="bx bx-check"></i> จัดการรายการจอง</li><li><i class="bx bx-check"></i> ดูปฏิทินรายเดือนและรายวัน</li><li><i class="bx bx-check"></i> รับแจ้งเตือนการจองทันที</li><li><i class="bx bx-check"></i> ตั้งเวลาเปิดบริการและวันหยุด</li></ul></section><section class="login-form-section"><div class="card login-card"><div class="card-body"><h2>เข้าสู่ระบบผู้ดูแล</h2><div th:if="${loginError}" class="alert alert-danger" role="alert">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div><form th:action="@{/admin/login}" method="post"><div class="mb-4"><label class="form-label" for="username">ชื่อผู้ใช้</label><div class="input-group input-group-merge input-group-lg"><span class="input-group-text"><i class="bx bx-user"></i></span><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div></div><div class="mb-4 form-password-toggle"><label class="form-label" for="password">รหัสผ่าน</label><div class="input-group input-group-merge input-group-lg"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="input-group-text cursor-pointer" aria-label="แสดงหรือซ่อนรหัสผ่าน"><i class="bx bx-hide"></i></button></div></div><div class="mb-4 form-check"><input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"><label class="form-check-label" for="rememberMe">จำฉันไว้</label></div><button class="btn btn-primary btn-lg w-100" type="submit">เข้าสู่ระบบ</button></form></div></div><a class="login-back" href="/"><i class="bx bx-left-arrow-alt"></i> กลับหน้าลูกค้า</a></section></main><th:block th:replace="~{fragments/common :: scripts}"></th:block></body></html>

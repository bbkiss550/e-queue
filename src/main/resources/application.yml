spring:
  application:
    name: e-queue
  config:
    import: optional:file:./application-local.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_queue}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
  thymeleaf:
    cache: false
  jackson:
    time-zone: Asia/Bangkok
server:
  port: ${PORT:8090}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
  remember-key: ${REMEMBER_KEY:}

spring:
  application:
    name: e-queue
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 12
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Bangkok
server:
  port: ${PORT:8090}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
app:
  remember-key: ${REMEMBER_KEY:}
